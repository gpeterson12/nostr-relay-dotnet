name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # PostgresEventStoreContractTests needs a reachable Postgres server, this service
    # container fills that role in CI the same way Postgres.app does locally. The
    # postgres superuser role has implicit CREATEDB, so PostgresDatabaseProvisioner's
    # auto-create path works here without any manual `createdb` step.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        env:
          # Matches this service container's credentials, not Postgres.app's local
          # trust-auth defaults (which PostgresEventStoreContractTests falls back to
          # when this variable is unset).
          NOSTR_RELAY_TEST_POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=nostr_relay_test"
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # Separate job because it shares nothing with the test job: no Postgres service, no SDK
  # setup, no restore cache. It exists so a Dockerfile that stops building is caught here
  # rather than the next time someone tries to deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag nostr-relay:ci .

      - name: Smoke test the image
        run: |
          docker run --detach --name nostr-relay-ci --publish 8080:8080 nostr-relay:ci

          # The image's own HEALTHCHECK exercises /health, which in turn exercises real
          # storage connectivity, so waiting for "healthy" proves the relay came up and
          # migrated its SQLite database, not merely that the process started.
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' nostr-relay-ci)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done

          if [ "$(docker inspect --format '{{.State.Health.Status}}' nostr-relay-ci)" != "healthy" ]; then
            docker logs nostr-relay-ci
            exit 1
          fi

          # NIP-11 content negotiation on the same root path the WebSocket uses.
          curl --fail --silent --header 'Accept: application/nostr+json' http://localhost:8080/

      - name: Container logs
        if: failure()
        run: docker logs nostr-relay-ci || true
